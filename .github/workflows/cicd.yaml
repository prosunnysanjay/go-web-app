# CICD using GitHub actions

name: CI/CD

# Exclude the workflow to run on changes to the helm chart
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'

jobs:

  build:
    runs-on: ubuntu-latest #VM where github action will run the stages and this is called runner

    steps:
    - name: Checkout repository #checkout source code
      uses: actions/checkout@v4

    - name: Set up Go 1.22 # install go lang in it
      uses: actions/setup-go@v2
      with:
        go-version: 1.22

    - name: Build # run build command
      run: go build -o go-web-app

    - name: Test #Test the unit test cases
      run: go test ./...
  
  code-quality:
    runs-on: ubuntu-latest #need to provide again for every job

    steps:
    - name: Checkout repository #again checkout
      uses: actions/checkout@v4

    - name: Run golangci-lint #common for go lang for Static code analysis. it is for linting
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.56.2
  
  push:
    runs-on: ubuntu-latest #add again 

    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push action
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:${{github.run_id}}

  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest

    needs: push #once push is completed then only this will start

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.TOKEN }} #for pushing it to github account we need token here

    - name: Update tag in Helm chart
      run: |
        sed -i 's/tag: .*/tag: "${{github.run_id}}"/' helm/go-web-app-chart/values.yaml

    - name: Commit and push changes
      run: |
        git config --global user.email "sanjaysunny078@gmail.com"
        git config --global user.name "prosunnysanjay"
        git add helm/go-web-app-chart/values.yaml
        git commit -m "Update tag in Helm chart"
        git push